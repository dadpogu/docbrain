[project]
name = "docbrain"
version = "0.1.0"
description = "Compliance-focused, version-aware regulatory knowledge and site documentation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docbrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# The prototype modules moved by DB-001 are characterized, not rewritten; see
# docs/coding_tasks.md for their recorded limitations.
per-file-ignores = { "src/docbrain/{router,broker_fusion,semantic_tree,graph_engine,lifecycle}.py" = ["UP", "E501", "W291", "W293", "F401", "F841", "B", "I"], "src/docbrain/__init__.py" = ["I"], "src/docbrain/models.py" = ["UP006", "UP035", "UP042", "UP045", "E501"] }

[tool.ruff.format]
exclude = ["src/docbrain/{__init__,router,broker_fusion,semantic_tree,graph_engine,lifecycle,models}.py"]

[tool.mypy]
python_version = "3.12"
files = ["src/docbrain"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
